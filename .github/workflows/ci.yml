name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          server/package-lock.json

    - name: Install dependencies
      run: |
        npm ci
        cd server && npm ci

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run typecheck
